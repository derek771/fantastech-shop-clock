<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#173b2f">
<title>Install Job Clock</title>
<style>
  :root { --ink:#10231c; --mute:#5c6b65; --line:#d9e2dd; --bg:#f3f6f4; --card:#fff; --green:#1f6f4f; --green2:#173b2f; --red:#b3261e; --amber:#a15c00; --amberbg:#fff3df; --blue:#1d4f8f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body { padding-bottom:90px; }
  header { position:sticky; top:0; z-index:5; background:var(--green2); color:#fff; padding:12px 14px calc(10px); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; font-weight:700; letter-spacing:.2px; }
  header .who { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:20px; padding:6px 12px; font-size:15px; font-weight:600; }
  .sync { font-size:12px; opacity:.8; margin-top:2px; }
  main { padding:12px 12px 20px; max-width:720px; margin:0 auto; }
  .tabs { display:flex; gap:6px; margin:0 0 12px; }
  .tabs button { flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 6px; font-size:15px; font-weight:600; color:var(--mute); }
  .tabs button.on { background:var(--green); color:#fff; border-color:var(--green); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:0 0 12px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card.on { border-color:var(--green); box-shadow:0 0 0 2px rgba(31,111,79,.18); }
  .card.done { opacity:.72; }
  .so { font-weight:800; font-size:18px; }
  .cust { font-size:17px; margin-top:2px; }
  .meta { color:var(--mute); font-size:14px; margin-top:6px; }
  .row { display:flex; gap:10px; align-items:center; }
  .row > * { min-width:0; }
  .grow { flex:1; }
  .btn { border:0; border-radius:12px; padding:14px 16px; font-size:17px; font-weight:800; color:#fff; background:var(--green); width:100%; }
  .btn.stop { background:var(--red); }
  .btn.plain { background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:700; }
  .btn.small { padding:9px 12px; font-size:15px; width:auto; }
  .btn.amber { background:var(--amber); }
  .btn.blue { background:var(--blue); }
  .btn:disabled { opacity:.45; }
  .big { font-size:34px; font-weight:800; letter-spacing:.5px; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; border-radius:999px; padding:3px 9px; font-size:13px; font-weight:700; background:#e8f1ec; color:var(--green); margin-right:4px; }
  .pill.red { background:#fbe9e7; color:var(--red); }
  .pill.amber { background:var(--amberbg); color:var(--amber); }
  .pill.grey { background:#eceff0; color:var(--mute); }
  .empty { color:var(--mute); text-align:center; padding:30px 10px; }
  .list { border-top:1px solid var(--line); margin-top:10px; }
  .item { display:flex; gap:10px; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line); }
  .item .t { flex:1; min-width:0; }
  .item .t small { color:var(--mute); display:block; font-size:13px; }
  input[type=text], input[type=number], input[type=datetime-local], select { width:100%; font-size:17px; padding:12px; border:1px solid #b9c6c0; border-radius:10px; background:#fff; color:var(--ink); }
  label { display:block; font-size:13px; color:var(--mute); font-weight:700; margin:10px 0 4px; text-transform:uppercase; letter-spacing:.4px; }
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:none; }
  .sheet-bg.show { display:block; }
  .sheet { position:fixed; left:0; right:0; bottom:0; max-height:92vh; overflow:auto; background:#fff; border-radius:18px 18px 0 0; padding:16px 14px 28px; z-index:21; transform:translateY(105%); transition:transform .18s ease; max-width:720px; margin:0 auto; }
  .sheet.show { transform:none; }
  .sheet h2 { margin:0 0 10px; font-size:19px; }
  .sug { border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:8px; }
  .sug div { padding:11px 12px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .sug div:last-child { border-bottom:0; }
  .sug .n { flex:1; }
  .sug .stock { font-size:12px; font-weight:800; color:var(--green); }
  .sug .stock.no { color:var(--mute); }
  .name-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .name-grid button { border:1px solid var(--line); background:#fff; border-radius:14px; padding:22px 8px; font-size:20px; font-weight:800; color:var(--ink); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); z-index:6; }
  .bar .inner { max-width:720px; margin:0 auto; display:flex; gap:8px; }
  .toast { position:fixed; left:50%; bottom:88px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:10px; font-size:15px; z-index:30; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; }
  .warn { background:var(--amberbg); border:1px solid #f0d9b0; color:#6b3d00; border-radius:10px; padding:10px 12px; font-size:15px; margin-bottom:12px; }
  .hist { font-size:13px; color:var(--mute); margin-top:4px; }
  .muted { color:var(--mute); }
  h3 { font-size:15px; text-transform:uppercase; letter-spacing:.5px; color:var(--mute); margin:18px 0 8px; }
  .kv { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:16px; }
  .center { text-align:center; }
  .link { color:var(--blue); font-weight:700; background:none; border:0; font-size:15px; padding:6px 0; }
</style>
</head>

var BACKEND = "https://script.google.com/macros/s/AKfycbyTLrMIOBMeybJX8qrPGmZQI4feYFc6iuGbHuJfhSPf4jCOdrlg86JrZ1JeUECA0F2nqQ/exec";

function uid(p) { return p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtClock(t) { var d = new Date(t); var h = d.getHours(), m = d.getMinutes(); var ap = h >= 12 ? "pm" : "am"; h = h % 12; if (h === 0) h = 12; return h + ":" + pad(m) + " " + ap; }
function fmtDate(t) { var d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate(); }
function fmtWhen(t) { return fmtDate(t) + " " + fmtClock(t); }

function toLocalInput(t) { var d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function fromLocalInput(s) { if (!s) return NaN; var t = new Date(s).getTime(); return t; }
function startOfDay(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function slug(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

/* ---------- state ----------

var L = {};

function todayView() {

    var j = S.jobs[k];

      var a = Math.max(p.start, from), b = p.stop === null ? now : p.stop; if (b <= a) return;

  }).join("") + '</div>';

  var typed = (document.getElementById("xTyped").value || "").trim(), qty = parseFloat(document.getElementById("xQty").value), unit = document.getElementById("xUnit").value;
  if (!typed && !extraPick) { toast("Type what it was"); return; }
  if (isNaN(qty) || qty <= 0) { toast("How many?"); return; }
  doOp({ kind: "extra.add", jobId: jobId, xid: uid("x"), typed: typed, qty: qty, unit: unit, pick: extraPick });
  toast(extraPick ? "Saved: " + extraPick.name : "Saved as typed — Cowork will match it");
  openJobSheet(jobId);
}
function removeExtra(jobId, xid) { doOp({ kind: "extra.remove", jobId: jobId, xid: xid }); openJobSheet(jobId); }

/* ---------- boot ---------- */
function setView(v) { view = v; render(); }
(function boot() {
  me = lsGet("ij_me", "");
  var cached = lsGet("ij_state", null);
  if (cached && cached.S) { S = cached.S; store.version = cached.version; if (!S.crew || !S.crew.length) S.crew = SEED_CREW.slice(); }
  var co = lsGet("ij_orders", null); if (co && co.list) ordersFeed = co;
  var ct = lsGet("ij_tracker", null); if (ct && ct.list) trackerFeed = ct;
  if (!S.pairs) S.pairs = SEED_PAIRS.slice();
  render();
  if (store.mode === "server") {
    setSync("connecting…");
    pull().then(function () { setSync(store.lastSeen ? "connected" : "cannot reach the store — working from this phone", !store.lastSeen); flush(); });
    pullOrders().then(function () { if (document.getElementById("orderList")) filterOrders(); });
    pullTracker();
    setInterval(function () { pull(); if (readPending().length) flush(); }, POLL_MS);
    setInterval(pullOrders, 5 * 60000);
    setInterval(pullTracker, 10 * 60000);
  } else { setSync("no store — this phone only"); }
  setInterval(function () { if (myRunning() || document.querySelector(".card.on")) render(); }, 30000);
  window.addEventListener("online", function () { flush(); });
})();
</script>
</body>
