<title>Shop Floor Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="app-style">
:root{
  --ground:#EDF0EE; --surface:#FFFFFF; --surface-2:#F5F8F6; --sunk:#E4E9E6;
  --line:#D3DBD7; --line-2:#BFC9C4;
  --ink:#111815; --ink-2:#54625C; --ink-3:#84918B;
  --go:#245D4E; --go-2:#2F7462; --go-ink:#FFFFFF;
  --run:#8A4E00; --run-bg:#FCF1DE; --run-line:#D9912B; --run-solid:#C97B14;
  --alert:#9E2F18; --alert-bg:#FAEAE5; --alert-line:#D4674A;
  --shadow:0 1px 2px rgba(17,24,21,.06), 0 6px 18px -8px rgba(17,24,21,.18);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1211; --surface:#161E1B; --surface-2:#1C2622; --sunk:#0A0F0E;
    --line:#2A3733; --line-2:#3A4A44;
    --ink:#E7EDEA; --ink-2:#9EACA6; --ink-3:#71807A;
    --go:#4FA189; --go-2:#5FB398; --go-ink:#06120E;
    --run:#F2B25C; --run-bg:#2B2013; --run-line:#8A5F1E; --run-solid:#E39A31;
    --alert:#F09277; --alert-bg:#2C1712; --alert-line:#8A3D28;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1211; --surface:#161E1B; --surface-2:#1C2622; --sunk:#0A0F0E;
  --line:#2A3733; --line-2:#3A4A44;
  --ink:#E7EDEA; --ink-2:#9EACA6; --ink-3:#71807A;
  --go:#4FA189; --go-2:#5FB398; --go-ink:#06120E;
  --run:#F2B25C; --run-bg:#2B2013; --run-line:#8A5F1E; --run-solid:#E39A31;
  --alert:#F09277; --alert-bg:#2C1712; --alert-line:#8A3D28;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 96px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid var(--go-2); outline-offset:2px
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--ink-3)}
.who{
  display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:7px 8px 7px 14px;box-shadow:var(--shadow);font-weight:600
}
.who small{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.who button{background:var(--sunk);border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;font-size:13px;font-weight:700;min-height:38px}
.who button:hover{background:var(--line)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:999px;padding:4px;margin-bottom:18px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;border-radius:999px;padding:11px 18px;font-weight:700;
  font-size:14px;color:var(--ink-2);white-space:nowrap;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- status strip ---------- */
.strip{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px
}
.strip div{background:var(--surface);padding:13px 15px}
.strip .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:3px}
.strip .v{font-size:25px;font-weight:700;letter-spacing:-.02em}
.strip .v.run{color:var(--run)}
.strip .v.alert{color:var(--alert)}
/* an odd last tile fills the row instead of leaving a grey hole */
.strip>div:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:640px){.strip>div:last-child:nth-child(odd){grid-column:auto}}

/* ---------- order cards ---------- */
.cards{display:flex;flex-direction:column;gap:10px}
.card{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px 15px 19px;box-shadow:var(--shadow);overflow:hidden
}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--line-2)}
.card.on{border-color:var(--run-line);background:var(--run-bg)}
.card.on::before{background:var(--run-solid);width:6px}
.card.done{opacity:.55}
.card.done::before{background:var(--go)}
.crow{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.cmain{flex:1 1 240px;min-width:0}
.so{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;font-weight:600;letter-spacing:-.01em}
.cust{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:1px;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;align-items:baseline}
.meta b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
.cact{display:flex;flex-direction:column;align-items:stretch;gap:7px;flex:0 0 auto;min-width:172px}
.clk{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;
  font-size:31px;font-weight:600;letter-spacing:-.02em;text-align:center;line-height:1.1;color:var(--run)
}
.clk small{display:block;font-family:Archivo,sans-serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:700;color:var(--run);opacity:.8}
.big{
  border:0;border-radius:11px;padding:0 20px;height:62px;font-size:17px;font-weight:800;
  letter-spacing:.01em;background:var(--go);color:var(--go-ink);width:100%;
  display:flex;align-items:center;justify-content:center;gap:9px
}
.big:hover{background:var(--go-2)}
.big.stop{background:var(--run-solid);color:#1B1206}
.big.stop:hover{filter:brightness(1.08)}
.big[disabled]{opacity:.4;cursor:not-allowed}
.mini{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:10px 14px;font-size:13px;font-weight:600;min-height:40px}
.mini:hover{background:var(--sunk)}
.who-on{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pill{
  font-size:12px;font-weight:700;background:var(--sunk);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px
}
.pill.live{background:var(--run-solid);border-color:var(--run-solid);color:#1B1206}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.card.on .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.card.on .dot{animation:none}}

/* ---------- banners ---------- */
.warn{
  display:flex;gap:12px;align-items:flex-start;background:var(--alert-bg);border:1px solid var(--alert-line);
  border-left-width:4px;border-radius:var(--r);padding:13px 15px;margin-bottom:14px;font-size:14px
}
.warn b{color:var(--alert)}
.warn .mini{margin-top:8px}
.saving{
  position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:40;
  background:var(--ink);color:var(--ground);border-radius:999px;padding:10px 20px;
  font-size:13px;font-weight:700;box-shadow:var(--shadow);display:none
}
.saving.show{display:block}
.saving.bad{background:var(--alert);color:#fff}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}
table.tight{min-width:0}
.subwho{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.pickbar{display:flex;align-items:center;gap:9px;margin-top:10px}
.pickbar .track{flex:1;height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.pickbar .fill{height:100%;background:var(--line-2);border-radius:99px;transition:width .18s}
.pickbar .fill.some{background:var(--run-solid)}
.pickbar .fill.all{background:var(--go)}
.pickbar b{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tchip.picked{background:var(--go);color:var(--go-ink)}
.tchip.dup{background:var(--alert-bg);color:var(--alert);border:1px solid var(--alert-line)}
/* ---------- the printed pick list ----------
   Emily's rule, 2026-08-21: the warehouse works off paper, so every line
   needs a REAL check box. These are drawn rectangles, never the U+2610
   character - a missing glyph prints as blank space and the box vanishes.
   Everything is forced black-on-white; a phone in dark mode must not print
   dark text on a dark fill. */
#printarea{display:none}
@media print{
  @page{size:letter;margin:0.5in}
  html,body{background:#fff!important;color:#000!important}
  .wrap,.sheet,.saving{display:none!important}
  #printarea{display:block!important;font-family:Arial,Helvetica,sans-serif;color:#000}
  #printarea *{color:#000!important;background:transparent!important}
  .pl-head{border-bottom:3px solid #000;padding-bottom:8px;margin-bottom:4px}
  .pl-head h1{font-size:22pt;margin:0;letter-spacing:-.01em}
  .pl-head .cust{font-size:15pt;font-weight:bold;margin-top:2px}
  .pl-sub{font-size:9.5pt;margin:6px 0 14px}
  .pl-note{border:1.5pt solid #000;padding:7px 9px;margin:0 0 14px;font-size:10.5pt}
  .pl-warn{border:2.5pt solid #000;padding:8px 10px;margin:0 0 14px;font-size:11pt;font-weight:bold}
  table.pl{width:100%;border-collapse:collapse;font-size:11pt;min-width:0}
  table.pl th{text-align:left;font-size:8.5pt;letter-spacing:.08em;text-transform:uppercase;
    border-bottom:1.5pt solid #000;padding:4px 6px}
  table.pl td{padding:9px 6px;border-bottom:.75pt solid #999;vertical-align:top}
  .pl-box{display:inline-block;width:15pt;height:15pt;border:1.5pt solid #000;
    vertical-align:middle}
  .pl-box.done{position:relative}
  .pl-box.done:after{content:"X";position:absolute;top:-3pt;left:2.5pt;
    font-size:14pt;font-weight:bold;line-height:1}
  .pl-qty{font-weight:bold;white-space:nowrap;font-size:12pt}
  .pl-by{display:block;font-size:8.5pt;margin-top:2px}
  .pl-sign{margin-top:26px;border-top:1.5pt solid #000;padding-top:10px;font-size:10.5pt}
  .pl-sign span{display:inline-block;margin-right:26px}
  .pl-foot{margin-top:14px;font-size:8.5pt}
}
.plist{display:flex;flex-direction:column;gap:8px;margin:4px 0 4px}
.pline{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 14px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;
  font:inherit;color:inherit;min-height:56px}
.pline:hover{border-color:var(--line-2)}
.pline.on{background:var(--sunk);border-color:var(--line-2)}
.pline .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;margin-top:1px}
.pline.on .box{background:var(--go);border-color:var(--go)}
.pline.on .box{color:var(--go-ink)}
.pline .txt{flex:1;min-width:0}
.pline .qty{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:700;font-size:15px}

th{

.srch .mag{position:absolute;left:14px;font-size:15px;color:var(--ink-3);pointer-events:none}

.srch input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.srch .clr{position:absolute;right:6px;background:var(--sunk);border:1px solid var(--line);

.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;

.chip.kit[aria-pressed="true"] b{background:rgba(0,0,0,.16);color:#1B1206}
.ghead{display:flex;align-items:center;gap:10px;margin:20px 0 9px}
.ghead h3{font-size:12px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--ink-3)}
.ghead span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--ink-3)}
.ghead .rule{flex:1;height:1px;background:var(--line)}
.tchip{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2);
  border:1px solid var(--line);white-space:nowrap}
.tchip.ws{background:var(--go);color:var(--go-ink);border-color:var(--go)}
.tchip.kit{background:var(--run-solid);color:#1B1206;border-color:var(--run-solid)}

:root[data-theme="dark"] .tchip.job{background:#A98BE0;color:#140C24;border-color:#A98BE0}

  padding:12px 14px;font-size:14px;margin-bottom:12px;color:var(--ink-2)}

.hint{font-size:13px;color:var(--ink-3);margin-top:12px;line-height:1.5}
.ro{background:var(--sunk);border:1px dashed var(--line-2);border-radius:var(--r);padding:11px 14px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
@media(max-width:560px){
  .cact{min-width:100%}
  .strip .v{font-size:22px}
  .row2{grid-template-columns:1fr}
}

<script id="app-src">
/* ============================================================
   Fantastech Shop Floor Clock
   Timing rule: we store the absolute clock time a job started.
   Elapsed is always (stop - start). We NEVER add up ticks, so
   a sleeping phone, a closed tab or a reload cannot drift.
   ============================================================ */

var App = (function () {
  "use strict";

  var HOUR = 3600000, MIN = 60000;

  /* ---------- helpers ---------- */
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uid(p) { return (p || "x") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* =====================================================
     LOGIC  — pure functions, no DOM. This is what the
     automated tests drive directly.
     ===================================================== */
  var L = {};

  L.activeEntry = function (state, workerId) {
    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      if (e.workerId === workerId && e.stop === null) return e;
    }
    return null;
  };

  L.elapsed = function (entry, now) {
    var end = entry.stop === null ? now : entry.stop;
    var d = end - entry.start;
    return d > 0 ? d : 0;
  };

  // Start a worker on an order. If that worker is already running
  // something else, close it at the SAME instant this one opens —
  // no gap, no overlap, no double-counting.
  L.clockIn = function (state, workerId, orderId, now, forceId) {
    var s = clone(state);
    if (!L.findOrder(s, orderId)) return s;
    var cur = L.activeEntry(s, workerId);
    if (cur && cur.orderId === orderId) return s;          // double-tap = no-op
    if (cur) cur.stop = now;
    s.entries.push({
      id: forceId || uid("e"), orderId: orderId, workerId: workerId,
      start: now, stop: null, edited: false
    });
    return s;
  };

  L.clockOut = function (state, workerId, now) {
    var s = clone(state);
    var cur = L.activeEntry(s, workerId);
    if (!cur) return s;
    if (now < cur.start) return s;                          // never allow negative
    cur.stop = now;
    return s;
  };

  L.findOrder = function (state, orderId) {
    for (var i = 0; i < state.orders.length; i++) if (state.orders[i].id === orderId) return state.orders[i];
    return null;
  };
  L.findEntry = function (state, entryId) {
    for (var i = 0; i < state.entries.length; i++) if (state.entries[i].id === entryId) return state.entries[i];
    return null;
  };
  L.workerName = function (state, workerId) {
    for (var i = 0; i < state.workers.length; i++) if (state.workers[i].id === workerId) return state.workers[i].name;
    return "?";
  };

  L.longRunMs = function (state) {
    return (state.settings.longRunHours || 4) * HOUR;
  };

  /* ---- is this phone's clock wrong? ----
     Every punch is stamped by the phone that made it. If one phone's clock is
     off, its hours are off by the same amount and nothing else can tell.
     What we CAN see: if somebody else's punch is stamped in our future, our
     clock is behind. Say so rather than quietly recording wrong times.
     ------------------------------------------------------------------ */
  L.clockSkew = function (state, now) {
    var max = 0;
    state.entries.forEach(function (e) {
      if (typeof e.start === "number" && e.start > max) max = e.start;
      if (typeof e.stop === "number" && e.stop > max) max = e.stop;
    });
    return max > now ? max - now : 0;
  };
  L.SKEW_LIMIT = 120000;   // two minutes of slop is fine

  // Anything that needs a human to look at it before the numbers are trusted.
  L.flags = function (state, now) {
    var out = [], lim = L.longRunMs(state);
    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      if (e.stop === null && (now - e.start) > lim) out.push({ entryId: e.id, kind: "running_long" });
      else if (e.stop !== null && e.stop < e.start) out.push({ entryId: e.id, kind: "negative" });
    }
    return out;
  };
  L.isFlagged = function (state, entryId, now) {
    var f = L.flags(state, now);
    for (var i = 0; i < f.length; i++) if (f[i].entryId === entryId) return true;
    return false;
  };

  // Roll every entry up per order. This is the job-costing number.
  L.orderTotals = function (state, now) {
    var byOrder = {};
    state.orders.forEach(function (o) {
      byOrder[o.id] = { order: o, ms: 0, running: false, workers: {}, entries: 0, flagged: 0 };
    });
    var lim = L.longRunMs(state);
    state.entries.forEach(function (e) {
      var b = byOrder[e.orderId];
      if (!b) return;
      var ms = L.elapsed(e, now);
      b.ms += ms; b.entries++;
      if (e.stop === null) {
        b.running = true;
        if ((now - e.start) > lim) b.flagged++;
      } else if (e.stop < e.start) b.flagged++;
      if (!b.workers[e.workerId]) b.workers[e.workerId] = { ms: 0 };
      b.workers[e.workerId].ms += ms;
    });
    return state.orders.map(function (o) { return byOrder[o.id]; });
  };

  L.grand = function (state, now) {
    var t = L.orderTotals(state, now), ms = 0, running = 0, flagged = 0;
    t.forEach(function (r) { ms += r.ms; if (r.running) running++; flagged += r.flagged; });
    return { ms: ms, orders: t.length, running: running, flagged: flagged };
  };

  // Hours per person, across everything.
  L.byWorker = function (state, now) {
    var m = {};
    state.workers.forEach(function (w) {
      m[w.id] = { worker: w, ms: 0, punches: 0 };
    });
    state.entries.forEach(function (e) {
      if (!m[e.workerId]) m[e.workerId] = { worker: { id: e.workerId, name: "(removed)" },
                                            ms: 0, punches: 0 };
      m[e.workerId].ms += L.elapsed(e, now);
      m[e.workerId].punches++;
    });
    return Object.keys(m).map(function (k) { return m[k]; })
      .filter(function (r) { return r.punches > 0; })
      .sort(function (a, b) { return b.ms - a.ms; });
  };

  // Fix a mis-punch. Always leaves an "edited" mark so the trail stays honest.
  L.editEntry = function (state, entryId, start, stop) {
    var s = clone(state), e = L.findEntry(s, entryId);
    if (!e) return { state: state, ok: false, why: "That entry is gone." };
    if (typeof start !== "number" || isNaN(start)) return { state: state, ok: false, why: "Start time is not a real time." };
    if (stop !== null && (typeof stop !== "number" || isNaN(stop))) return { state: state, ok: false, why: "Stop time is not a real time." };
    if (stop !== null && stop < start) return { state: state, ok: false, why: "Stop time is before the start time." };
    e.start = start; e.stop = stop; e.edited = true;
    return { state: s, ok: true };
  };

  L.deleteEntry = function (state, entryId) {
    var s = clone(state);
    s.entries = s.entries.filter(function (e) { return e.id !== entryId; });
    return s;
  };

  L.addOrder = function (state, so, customer, note, now, forceId) {
    var s = clone(state);
    s.orders.unshift({
      id: forceId || uid("o"), so: String(so || "").trim(),
      customer: String(customer || "").trim(), note: String(note || "").trim(),
      status: "open", createdAt: now
    });
    return s;
  };

  /* =====================================================
     GROUPS — wholesale / retail / kit
     A Kit line means an FRP board build: different work from
     pick-and-pack, so it gets its own group and comes OUT of
     the wholesale/retail lists. The tier still shows on the card.
     ===================================================== */
  // A JOB is any order with somebody's time on it — a Labor, Service Call or
  // Trip line. Somebody is going out. That outranks everything else, because
  // it is the work that most needs its hours measured.
  // Then a KIT (a board build on the bench). Everything left splits by tier.
  L.groupOf = function (o) {
    if (!o) return "retail";
    if (o.hasLabor) return "job";
    if (o.hasKit) return "kit";
    return o.tier === "wholesale" ? "wholesale" : "retail";
  };
  L.GROUPS = [
    { key: "all", label: "All" },
    { key: "job", label: "Jobs" },
    { key: "kit", label: "Kits" },
    { key: "wholesale", label: "Wholesale" },
    { key: "retail", label: "Retail" }
  ];
  L.groupCounts = function (state) {
    var c = { all: 0, job: 0, kit: 0, wholesale: 0, retail: 0 };
    state.orders.forEach(function (o) {
      if (o.status !== "open") return;
      c.all++; c[L.groupOf(o)]++;
    });
    return c;
  };

  /* =====================================================
     SEARCH — forgiving. A misspelled name still finds the
     customer, and we never answer "not found": if nothing
     matches well we show the closest names instead.
     ===================================================== */
  L.norm = function (x) {
    return String(x == null ? "" : x).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  };
  L.digits = function (x) { return String(x == null ? "" : x).replace(/\D/g, ""); };

  // Edit distance, capped so a long string can't cost much.
  L.lev = function (a, b) {
    if (a === b) return 0;
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    if (Math.abs(m - n) > 6) return Math.abs(m - n) + 6;
    var prev = [], cur = [], i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                          prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
      }
      for (j = 0; j <= n; j++) prev[j] = cur[j];
    }
    return prev[n];
  };
  // 0..1, how alike two words are
  L.similar = function (a, b) {
    if (!a || !b) return 0;
    var d = L.lev(a, b), L2 = Math.max(a.length, b.length);
    return L2 ? Math.max(0, 1 - d / L2) : 0;
  };

  // Score one order against one query.
  // Returns { score 0..100, literal } — literal means the words were really
  // in there, not a spelling guess. That is what decides whether we show the
  // result plainly or say "no exact match, closest is...".
  L.score = function (state, o, rawQuery) {
    var q = L.norm(rawQuery);
    if (!q) return { score: 0, literal: false };

    var cust = L.norm(o.customer);
    var custNS = cust.replace(/ /g, "");
    var so = L.norm(o.so), note = L.norm(o.note);
    var qNS = q.replace(/ /g, "");
    var qd = L.digits(rawQuery), sod = L.digits(o.so);

    // ---- literal hits: the typed text really is in there ----
    var lit = 0;
    function L1(v) { if (v > lit) lit = v; }
    if (cust === q) L1(100);
    if (cust.indexOf(q) === 0) L1(96);
    if (cust.indexOf(q) > -1) L1(90);
    if (qNS.length >= 4 && custNS.indexOf(qNS) > -1) L1(88);
    if (so.indexOf(q) > -1) L1(86);
    if (qd.length >= 3 && sod.indexOf(qd) > -1) L1(qd.length === sod.length ? 97 : 84);
    if (note && note.indexOf(q) > -1) L1(58);

    // ---- word by word, so EVERY word typed has to land somewhere ----
    // Taking the average (not the best) stops a common word like "river"
    // from carrying the wrong customer to the top.
    var qt = q.split(" ").filter(Boolean);
    var ct = cust.split(" ").filter(Boolean);
    var sum = 0, allLiteral = true;

    qt.forEach(function (w) {
      var best = 0, bestLiteral = false;
      ct.forEach(function (t) {
        if (t === w)                { if (100 > best) { best = 100; bestLiteral = true; } return; }
        if (t.indexOf(w) === 0)     { if (90 > best)  { best = 90;  bestLiteral = true; } return; }
        if (w.length >= 3 && t.indexOf(w) > -1) { if (78 > best) { best = 78; bestLiteral = true; } return; }
        if (w.length >= 3) {

          if (sim >= 0.6) { var v = Math.round(45 + sim * 45); if (v > best) { best = v; bestLiteral = false; } }

      if (w.length >= 3 && so.indexOf(w) > -1 && 80 > best) { best = 80; bestLiteral = true; }
      if (!bestLiteral) allLiteral = false;
      sum += best;
    });

    var tok = qt.length ? Math.round(sum / qt.length) : 0;
    if (tok < 50) { tok = 0; allLiteral = false; }        // a word missed entirely = not this one

    if (lit >= tok) return { score: lit, literal: true };

      return opts.includeDone ? true : o.status === "open";
    });

                     .filter(function (r) { return r.score > 0; })

  // ---- bring orders in from inFlow ----
  // Rules that keep this safe to run every day:
  //  * an order already on the board is matched by its inFlow id, never re-added
  //  * a punch is NEVER touched, moved or deleted by a sync

  L.mergeInflow = function (state, incoming, now) {

      if (!inc || !inc.inflowId) return;
      var ex = byInflow[inc.inflowId];

      if (!ex) {
        if (inc.status === "done") return;               // already finished; skip

          id: uid("o"), inflowId: inc.inflowId,
          so: String(inc.so || "").trim(),
          customer: String(inc.customer || "").trim(),
          note: L.scrubNote(inc.note),
          status: "open", createdAt: now,
          orderDate: inc.orderDate || null,

          scheme: inc.scheme || "",

      if (inc.customer && ex.customer !== inc.customer) { ex.customer = inc.customer; updated++; }
      if (inc.orderDate) ex.orderDate = inc.orderDate;
      // tier and Kit come from inFlow every time — they can change there
      if (inc.tier) ex.tier = inc.tier === "wholesale" ? "wholesale" : "retail";
      if (inc.scheme) ex.scheme = inc.scheme;
      if (typeof inc.hasKit === "boolean") ex.hasKit = inc.hasKit;
      if (typeof inc.hasLabor === "boolean") ex.hasLabor = inc.hasLabor;
      // The pick list refreshes from inFlow; the ticks live in state.picks,
      // keyed by inFlow's line id, so they are not touched by this.
      if (Array.isArray(inc.lines)) ex.lines = inc.lines.slice();

    // onto the board has no inFlow date, so we fall back to when it was added
    // here — otherwise a walk-up job would sink under months-old orders.
    // An order inFlow stopped sending has either been finished, aged out, or
    // has nothing on it to pick. It comes off the board - but ONLY if nobody
    // is clocked onto it and nothing on it has been ticked. Work is never

      var ticked = L.linesOf(o).some(function (l) { return L.pickState(s, l.id); });

  /* ---------- the pick list ---------- */

  // re-sync can refresh the list without forgetting what is already picked.
  // A pick is a decision with a time on it: the newest decision wins, which
  // is what lets two phones tick the same order without fighting.
  L.linesOf = function (order) {
    return (order && Array.isArray(order.lines)) ? order.lines : [];

    s.picks[lineId] = { on: !!on, by: workerId || null, at: now };
    return s;
  };

  L.prunePicks = function (state) {
    var s = clone(state);
    if (!s.picks) { s.picks = {}; return s; }
    var live = {};
    s.orders.forEach(function (o) {
      L.linesOf(o).forEach(function (l) { if (l && l.id) live[l.id] = 1; });
    });

  L.scrubNote = function (note) {
    if (!note) return "";
    var t = String(note)
      .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, "")
      .replace(/\(?\d{3}\)?[ .-]?\d{3}[ .-]?\d{4}/g, "");

    // history with dollar figures on it; drop those sentences and keep the
    // build instructions, which is the part a picker actually needs.
    var money = /[$\u00a3\u20ac]\s?\d|\bUSD\b|\bprice[sd]?\b|\bcost\b|\btotal\b/i;

         .map(function (x) { return x.trim(); })

      .replace(/\(\s*[/,]?\s*\)/g, "")

  L.applyOp = function (state, op) {

  /* =====================================================
     STORAGE
     ===================================================== */
  var PENDING = "ftsc_pending_v1";
  var LOCAL = "ftsc_state_v1";
  var WHO = "ftsc_worker_v1";

  // Where the punches and pick ticks live. Set by the deploy; if it is blank
  // the board still works, it just keeps everything on this one phone.
  var BACKEND = (document.getElementById("app-backend") || {}).textContent || "";
  BACKEND = BACKEND.trim();

  var store = { mode: BACKEND ? "server" : "local", version: null, readOnly: false,
                lastSeen: 0 };

  function readPending() {
    try { return JSON.parse(localStorage.getItem(PENDING) || "[]"); } catch (x) { return []; }
  }
  function writePending(ops) {
    try { localStorage.setItem(PENDING, JSON.stringify(ops)); } catch (x) {}
  }
  function pushPending(op) { var p = readPending(); p.push(op); writePending(p); }


  // The ORDERS come with the page - the morning inFlow sync bakes them in.
  // The WORK (punches and pick ticks) comes from the shop's own store, and
  // until that answers we show whatever this device last saw, so a man on a
  // dead signal still opens to his own running timer.
  function loadState() {
    var base;
    try { base = JSON.parse(document.getElementById("app-state").textContent); }
    catch (x) { base = null; }
    if (!base) base = { v: 4, settings: {}, workers: [], orders: [], entries: [], picks: {} };

    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(LOCAL) || "null"); } catch (x) {}
    if (cached) {
      // Only the work is taken from the device. The order list on the page is
      // always newer than a cached one, so it wins.
      if (Array.isArray(cached.entries)) base.entries = cached.entries;
      if (cached.picks && typeof cached.picks === "object") base.picks = cached.picks;
      if (typeof cached.__version === "number") store.version = cached.__version;

  }

  // Lay the shop's copy of the work over ours, then put back anything this
  // device is still holding. Never the other way round - the store wins, and
  // our own unsent taps are re-applied on top.
  function adopt(serverEntries, serverPicks, version) {
    var next = clone(S);
    next.entries = Array.isArray(serverEntries) ? serverEntries : [];
    next.picks = (serverPicks && typeof serverPicks === "object") ? serverPicks : {};
    readPending().forEach(function (op) {
      if (!L.opLanded(next, op)) next = L.applyOp(next, op);
    });
    store.version = version;
    // Deliberately NOT pruned here. A phone may be holding an older copy of
    // the order list, and pruning against it would throw away a tick another
    // man just made on a line this page has not heard about yet. Tidying dead
    // ticks is the morning sync's job, where the full order list is known.
    S = next;
    return S;
  }

  // Bring anything saved by an older version forward without inventing numbers.
  function migrate(b) {
    if (!b || typeof b !== "object") b = {};
    if (!b.settings) b.settings = {};
    if (!b.workers) b.workers = [];
    if (!b.orders) b.orders = [];
    if (!b.entries) b.entries = [];
    // Old versions had one flat shop rate and no wages. We do NOT turn that
    // rate into a wage — it was a billing number, not what anybody is paid.
    // The people keep no wage, so the screen says "not set" instead of guessing.
    if (typeof b.settings.longRunHours !== "number") b.settings.longRunHours = 4;
    // This board is hours only. Any money left over from an older version is
    // stripped out here so it can never sit in a page the crew can open.
    delete b.settings.laborRate;
    delete b.settings.burdenPct;
    b.workers.forEach(function (w) { delete w.wage; delete w.rate; });
    b.orders.forEach(function (o) { delete o.matCost; delete o.sellPrice; delete o.costGaps; });
    b.entries.forEach(function (e) { delete e.rate; });
    if (!b.picks || typeof b.picks !== "object") b.picks = {};
    // This board is a shop-floor screen. A customer's email address or phone
    // number has no business on a picking list, wherever the note came from.
    b.orders.forEach(function (o) { o.note = L.scrubNote(o.note); });
    b.orders.forEach(function (o) { if (!Array.isArray(o.lines)) o.lines = []; });

  function jsonForHtml(o) {
    return JSON.stringify(o).replace(/</g, "\\u003C").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");

  // The home-screen / app-icon tags, read off this page so a republish keeps them.
  var HEAD_APP = (function () {
    var out = "", sel = 'meta[name="theme-color"],meta[name="mobile-web-app-capable"],' +
      'meta[name="apple-mobile-web-app-capable"],meta[name="apple-mobile-web-app-title"],' +

    var css = document.getElementById("app-style").textContent;
    var src = document.getElementById("app-src").textContent;

    // punches into the page would put a stale second copy in front of every
    // phone, so they are stripped here on purpose.
    var forPage = clone(state);

    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
      HEAD_APP +
      "<title>Shop Floor Clock<" + "/title>\n" +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">\n' +
      '<style id="app-style">' + css + "<" + "/style>\n</head>\n<body>\n" +
      '<div class="wrap"><div id="root"><' + "/div><" + "/div>\n" +
      '<div class="saving" id="saving"><' + "/div>\n" +
      '<div id="printarea"><' + "/div>\n" +

  function toast(msg, bad) {
    var el = document.getElementById("saving");
    if (!el) return;
    el.textContent = msg;

    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.className = "saving"; }, bad ? 6000 : 1800);
  }

  /* ---------- sending punches to the shared copy ----------
     A punch is written to this device FIRST, then sent. If the send
     fails for any reason short of "you cannot write here", the punch
     stays on the device and we keep trying until it lands. Nothing is
     ever dropped because the wifi hiccuped.

  var retryTimer = null, retryStep = 0;

    if (retryTimer) return;

  // preflight request, which the store cannot answer.
  function sendState(state) {
    cacheLocally(state);
    if (store.mode !== "server") return Promise.resolve({ ok: true, code: "local" });

    var body = JSON.stringify({
      version: store.version, by: me || "",
      entries: state.entries, picks: state.picks

    return fetch(BACKEND, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: body

      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) {
          store.version = d.version;
          store.lastSeen = Date.now();
          cacheLocally(state);
          return { ok: true, code: "ok" };

        if (d && d.conflict) {

          // top, and the caller sends again.
          adopt(d.entries, d.picks, d.version);
          return { ok: false, code: "conflict" };

        return { ok: false, code: (d && d.error) || "upstream_error" };

  // slow poll, so one man sees another man clock on.
  function pullState() {
    if (store.mode !== "server") return Promise.resolve(false);

      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) return false;

  // Send again. What this device is holding is already inside S, so the job is
  // simply to get S onto the shared copy. We only clear the held punches once
  // the send actually succeeded — never before.
  function flushPending() {
    if (store.mode !== "server") return Promise.resolve(false);
    if (!readPending().length) { retriesDone(); return Promise.resolve(true); }
    return sendState(S).then(function (res) {
      if (res.ok) { writePending([]); retriesDone(); return true; }
      if (res.code === "conflict") {

          handleFail(r2.code);
          return false;

      handleFail(res.code);
      return false;

  // Runs once on open: get the shop's copy, then push back anything this
  // device is still holding that the shop has not got.
  function replayOnLoad() {
    if (store.mode !== "server") return Promise.resolve(false);
    return pullState().then(function () {
      var ops = readPending();
      if (!ops.length) { retriesDone(); return true; }
      var next = S, changed = false;
      ops.forEach(function (op) {
        if (!L.opLanded(next, op)) { next = L.applyOp(next, op); changed = true; }
      });
      if (!changed) { writePending([]); retriesDone(); return true; }
      S = next;
      return flushPending();

  function handleFail(code) {

      // is the guard doing its job - say so loudly rather than retrying.

    }
    // offline, busy, anything else: keep trying, quietly.
    var n = pendingCount();
    toast(n + " tap" + (n === 1 ? "" : "s") +
          " not saved yet — still trying. Leave this page open.", true);
    scheduleRetry();
    render();
  }

  // Save a change. `op` is the punch to hold onto until it lands.
  function save(state, op) {
    S = state;
    if (op) pushPending(op);

    if (store.mode === "local") {
      cacheLocally(state);
      if (op) writePending(readPending().filter(function (p) { return p.id !== op.id; }));
      render();
      return Promise.resolve(true);
    }

    toast("Saving…");
    return sendState(state).then(function (res) {
      if (res.ok) {
        if (op) writePending(readPending().filter(function (p) { return p.id !== op.id; }));
        retriesDone();
        return true;
      }
      if (res.code === "conflict") {
        // adopt() already put our tap back on top of the winning copy.
        return sendState(S).then(function (r2) {
          if (r2.ok) {
            if (op) writePending(readPending().filter(function (p) { return p.id !== op.id; }));
            retriesDone();
            render();
            return true;
          }
          handleFail(r2.code);
          return false;
        });
      }
      handleFail(res.code);
      return false;
    });
  }

  /* =====================================================
     UI STATE
     ===================================================== */
  var S = null;
  var me = null;
  var tab = "clock";
  var sheet = null;
  var ticker = null;

  function now() { return Date.now(); }

  /* =====================================================
     RENDER
     ===================================================== */
  function render() {
    var root = document.getElementById("root");
    if (!root) return;
    var t = now();
    root.innerHTML = header(t) + tabsHtml() + (tab === "clock" ? clockView(t) : tab === "cost" ? hoursView(t) : logView(t));
    wire();
    if (sheet) drawSheet();
    tick();
  }

  function header(t) {
    var name = me ? L.workerName(S, me) : null;
    return '<div class="top">' +
      '<div class="brand"><b>Shop Floor Clock</b><span>Fantastech Energy Solution</span></div>' +
      (name
        ? '<div class="who"><small>On this device</small><span>' + esc(name) + '</span>' +
          '<button data-a="switch">Switch</button></div>'
        : "") +
      "</div>";
  }

  function tabsHtml() {
    function b(k, label) {
      return '<button data-tab="' + k + '" aria-selected="' + (tab === k) + '">' + label + "</button>";
    }
    return '<div class="tabs" role="tablist">' + b("clock", "Clock") + b("cost", "Hours") + b("log", "Time Log") + "</div>";
  }

  // Loud, honest banner when a punch has not reached the shared copy yet.
  function heldNote() {
    var n = (store.mode === "server") ? pendingCount() : 0;
    if (!n) return "";
    return '<div class="warn"><div><b>' + n + " punch" + (n === 1 ? " is" : "es are") +
      " still on this phone, not on the shop board yet.</b><br>" +
      "It keeps trying by itself. Leave this page open and it will go through. " +
      "The time on it is already correct — nothing is lost." +
      '<br><button class="mini" data-a="retry">Try now</button></div></div>';
  }

  function dupNote() {
    var dups = S.orders.filter(function (o) {
      return o.status === "open" && o.dupOf && o.dupOf.length;
    });
    if (!dups.length) return "";
    var seen = {}, pairs = [];
    dups.forEach(function (o) {
      o.dupOf.forEach(function (d) {
        var key = [o.so, d.so].sort().join("|");
        if (seen[key]) return;
        seen[key] = 1;
        pairs.push(esc(o.so) + " and " + esc(d.so) + " (" +
                   esc(o.customer || "") + ", " + d.pct + "% the same)");
      });
    });
    return '<div class="warn"><div><b>' + pairs.length + " order" +
      (pairs.length > 1 ? "s look" : " looks") + " like a repeat.</b><br>" +
      pairs.join("<br>") +
      "<br>Check with Derek before picking both \u2014 it may be one job entered twice.</div></div>";
  }

  // Loud warning if this phone's own clock is behind everyone else's.
  function skewNote(t) {
    var off = L.clockSkew(S, t);
    if (off <= L.SKEW_LIMIT) return "";
    var mins = Math.round(off / 60000);
    return '<div class="warn"><div><b>This phone\'s clock looks about ' +
      (mins < 1 ? "a minute" : mins + " minute" + (mins === 1 ? "" : "s")) +
      " behind.</b><br>Somebody else's punch is stamped later than right now on this screen. " +
      "Any punch made here will be off by about that much. " +
      "Open the phone's Settings and turn on the automatic date and time.</div></div>";
  }

  function readOnlyNote() { return ""; }

  /* ---------- Clock ---------- */
  function clockView(t) {
    if (!me) return readOnlyNote() + pickWorkerView();

    var g = L.grand(S, t);
    var mine = L.activeEntry(S, me);
    var open = S.orders.filter(function (o) { return o.status === "open"; });
    var flags = L.flags(S, t);
    var h = readOnlyNote() + heldNote() + skewNote(t) + dupNote();

    if (flags.length) {
      h += '<div class="warn"><div><b>' + flags.length + " timer" + (flags.length > 1 ? "s have" : " has") +
        " been running a long time.</b><br>Somebody probably forgot to hit Stop. These hours are left out of nothing — " +
        "they are still counted — so fix the stop time before you trust the totals." +
        '<br><button class="mini" data-tab="log">Go fix it</button></div></div>';
    }

    h += '<div class="strip">' +
      '<div><div class="k">Clocked on now</div><div class="v ' + (g.running ? "run" : "") + '">' + g.running + "</div></div>" +
      '<div><div class="k">Open orders</div><div class="v">' + open.length + "</div></div>" +
      '<div><div class="k">Hours today</div><div class="v">' + L.decHours(hoursSince(startOfDay(t), t)) + "</div></div>" +
      (flags.length ? '<div><div class="k">Need a look</div><div class="v alert">' + flags.length + "</div></div>" : "") +
      "</div>";

    if (!S.orders.length) {
      h += '<div class="actbar"><button class="mini" data-a="addorder">+ Add an order</button></div>';
      h += '<div class="empty"><b>No orders on the board yet.</b>They load from inFlow every weekday morning, ' +
        "or tap “Add an order” to put one on now.</div>";
      return h;
    }

    // ---- search box + group chips ----
    var counts = L.groupCounts(S);
    h += '<div class="tools"><div class="srch"><span class="mag">⌕</span>' +
      '<input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" ' +
      'placeholder="Search a customer or SO number" value="' + esc(query) + '">' +
      (query ? '<button class="clr" data-a="clearq" aria-label="Clear the search">✕</button>' : "") +
      "</div>";
    h += '<div class="chips">' + L.GROUPS.map(function (gr) {
      return '<button class="chip' + (gr.key === "kit" ? " kit" : gr.key === "job" ? " job" : "") +
        '" data-a="group" data-id="' + gr.key +
        '" aria-pressed="' + (group === gr.key) + '">' + gr.label + "<b>" + counts[gr.key] + "</b></button>";
    }).join("") + "</div></div>";

    var totals = {};
    L.orderTotals(S, t).forEach(function (r) { totals[r.order.id] = r; });

    // ---- searching: one flat ranked list, across every group ----
    if (query.trim()) {
      var res = L.searchOrders(S, query, { includeDone: showDone });
      if (!res.results.length) {
        h += '<div class="empty"><b>Nothing on the board looks like “' + esc(query) + '”.</b>' +
          "Check the spelling, or try just the last name or the SO number.</div>";
        return h;
      }
      if (res.closest) {
        h += '<div class="nearby">No exact match for <b>' + esc(query) + '</b>. ' +
          "Closest " + (res.results.length > 1 ? "ones" : "one") + " on the board:</div>";
      }
      h += '<div class="cards">' +
        res.results.map(function (r) { return card(r.order, totals[r.order.id], mine, t); }).join("") +
        "</div>";
      return h;
    }

    // ---- not searching: grouped board ----
    h += '<div class="actbar"><button class="mini" data-a="addorder">+ Add an order</button>' +
      '<button class="mini" data-a="toggledone" aria-pressed="' + showDone + '">' +
      (showDone ? "Hide finished orders" : "Show finished orders") + "</button></div>";

    var list = showDone ? S.orders : open;
    if (!list.length) {
      h += '<div class="empty"><b>Every order is finished.</b>The next ones load from inFlow in the morning.</div>';
      return h;
    }

    var order = group === "all" ? ["job", "kit", "wholesale", "retail"] : [group];
    var shown = 0;

    order.forEach(function (key) {
      var rows = list.filter(function (o) { return L.groupOf(o) === key; });
      if (!rows.length) return;
      shown += rows.length;
      var meta = { job: "Jobs — our own labor is on these",
                   kit: "Kits — inverter and load centre on an FRP board",
                   wholesale: "Wholesale — dealers and installers",
                   retail: "Retail — end customers" }[key];
      h += '<div class="ghead"><h3>' + esc(meta) + "</h3><span>" + rows.length + '</span><div class="rule"></div></div>';
      h += '<div class="cards">' +
        rows.map(function (o) { return card(o, totals[o.id], mine, t); }).join("") + "</div>";
    });

    if (!shown) {
      h += '<div class="empty"><b>Nothing in this group right now.</b>Tap “All” to see the whole board.</div>';
    }
    return h;
  }

  // One order card.
  function card(o, r, mine, t) {
    r = r || { ms: 0, entries: 0 };
    var mineHere = mine && mine.orderId === o.id;
    var liveWorkers = S.entries.filter(function (e) { return e.orderId === o.id && e.stop === null; });
    var grp = L.groupOf(o);

    var h = '<div class="card' + (liveWorkers.length ? " on" : "") + (o.status === "done" ? " done" : "") + '">' +
      '<div class="crow"><div class="cmain">' +
      '<div class="chiprow">' +
      (o.hasLabor ? '<span class="tchip job">Job</span>' : "") +
      (o.hasKit ? '<span class="tchip kit">Kit build</span>' : "") +
      (L.pickCount(S, o).all ? '<span class="tchip picked">Picked</span>' : "") +
      dupChip(o) +
      '<span class="tchip' + (o.tier === "wholesale" ? " ws" : "") + '">' +
        (o.tier === "wholesale" ? "Wholesale" : "Retail") + "</span>" +
      (o.status === "done" ? '<span class="tchip">Finished</span>' : "") +
      "</div>" +
      (o.so ? '<div class="so">' + esc(o.so) + "</div>" : "") +
      '<div class="cust">' + esc(o.customer || "(no name)") + "</div>" +
      (o.note ? '<div class="note">' + esc(o.note) + "</div>" : "") +
      '<div class="meta"><span class="lbl">Time on it</span><b>' + L.hoursText(r.ms) + "</b>" +
      '<span class="lbl">Punches</span><b>' + r.entries + "</b></div>" +
      pickBar(o) +
      (liveWorkers.length
        ? '<div class="who-on">' + liveWorkers.map(function (e) {
            return '<span class="pill live"><span class="dot"></span>' + esc(L.workerName(S, e.workerId)) +
              ' <span class="mono" data-live="' + e.id + '">' + L.hms(L.elapsed(e, t)) + "</span></span>";
          }).join("") + "</div>"
        : "") +
      "</div>";

    h += '<div class="cact">';
    if (mineHere) {
      h += '<div class="clk"><span class="mono" data-live="' + mine.id + '">' + L.hms(L.elapsed(mine, t)) +
        "</span><small>You are on this</small></div>" +
        '<button class="big stop" data-a="out"' + ">Stop</button>";
    } else if (o.status === "done") {
      h += '<button class="mini" data-a="reopen" data-id="' + o.id + '">Re-open this order</button>';
    } else {
      h += '<button class="big" data-a="in" data-id="' + o.id + '"' + ">Start</button>";
      if (mine) h += '<div class="hint" style="text-align:center;margin:0">Starts here and stops ' +
        esc(orderLabel(L.findOrder(S, mine.orderId))) + " for you.</div>";
    }
    if (L.linesOf(o).length) {
      var pc = L.pickCount(S, o);
      h += '<button class="mini" data-a="picklist" data-id="' + o.id + '">' +
        (pc.all ? "Pick list \u2713" : pc.done ? "Pick list \u2014 " + pc.left + " to go" : "Pick list") +
        "</button>";
      h += '<button class="mini" data-a="print" data-id="' + o.id + '">Print it</button>';
    }
    if (o.status !== "done" && !mineHere) {
      h += '<button class="mini" data-a="finish" data-id="' + o.id + '">Mark finished</button>';
    }
    h += "</div></div></div>";
    return h;
  }

  /* ---------- printing a pick list ----------
     One tap lays the sheet out and opens the print dialog. A browser is not
     allowed to push straight to a printer without that dialog - no web page
     can - so this is one tap and then Print.

     Follows the paper format Emily set on 2026-08-21: a check box on every
     line, quantity in bold, and a sign-off line at the bottom. Anything
     already ticked on a phone prints pre-crossed, with who did it.
     ------------------------------------------------------------------- */
  function printPickList(orderId) {
    var o = L.findOrder(S, orderId);
    if (!o) return;
    var lines = L.linesOf(o);
    var c = L.pickCount(S, o);
    var now2 = new Date(now());

    var h = '<div class="pl-head"><h1>PICK LIST &nbsp;&middot;&nbsp; ' +
      esc(o.so || "(no number)") + "</h1>" +
      '<div class="cust">' + esc(o.customer || "(no name)") + "</div></div>" +
      '<div class="pl-sub">' +
      lines.length + " line" + (lines.length === 1 ? "" : "s") +
      (c.done ? " &nbsp;&middot;&nbsp; " + c.done + " already ticked off on a phone" : "") +
      (o.hasLabor ? " &nbsp;&middot;&nbsp; JOB - our own labor on this one" : "") +
      (o.hasKit ? " &nbsp;&middot;&nbsp; KIT BUILD - inverter and load center on an FRP board" : "") +
      " &nbsp;&middot;&nbsp; " + (o.tier === "wholesale" ? "Wholesale" : "Retail") +
      " &nbsp;&middot;&nbsp; printed " + esc(L.clockText(now())) + "</div>";

    if (o.dupOf && o.dupOf.length) {
      h += '<div class="pl-warn">CHECK BEFORE YOU PICK: this looks like ' +
        o.dupOf.map(function (d) { return esc(d.so) + " (" + d.pct + "% the same)"; }).join(" and ") +
        ". It may be one job entered twice.</div>";
    }
    if (o.note) h += '<div class="pl-note">' + esc(o.note) + "</div>";

    if (!lines.length) {
      h += "<p>Nothing listed on this order.</p>";
    } else {
      h += '<table class="pl"><thead><tr>' +
        '<th style="width:26pt"></th><th style="width:70pt">Qty</th><th>Item</th>' +
        '</tr></thead><tbody>';
      lines.forEach(function (l) {
        var p = L.pickState(S, l.id);
        h += "<tr><td><span class=\"pl-box" + (p ? " done" : "") + "\"></span></td>" +
          '<td class="pl-qty">' + esc(String(l.qty)) + " " + esc(l.uom || "") + "</td>" +
          "<td>" + esc(l.name) +
          (p ? '<span class="pl-by">already picked by ' +
               esc(L.workerName(S, p.by) || "somebody") + " &middot; " +
               esc(L.clockText(p.at)) + "</span>" : "") +
          "</td></tr>";
      });
      h += "</tbody></table>";
    }

    h += '<div class="pl-sign"><span>Picked by ____________________</span>' +
      "<span>Date ____________</span><span>Checked by ____________________</span></div>";
    h += '<div class="pl-foot">Fantastech Energy Solution &middot; ' +
      esc(o.so || "") + " &middot; tick these off on the phone too so the office sees it</div>";

    var area = document.getElementById("printarea");
    if (!area) return;
    area.innerHTML = h;
    // Let the layout settle before the dialog opens, or some phones print
    // a half-drawn sheet.
    setTimeout(function () { try { window.print(); } catch (x) {} }, 60);
  }

  // Two orders for the same customer carrying the same stuff. Say so on the
  // card, loudly, before somebody picks the same job twice.
  function dupChip(o) {
    var d = (o && Array.isArray(o.dupOf)) ? o.dupOf : [];
    if (!d.length) return "";
    var names = d.map(function (x) { return esc(x.so); }).join(" and ");
    return '<span class="tchip dup">Looks like ' + names + '</span>';
  }

  // The little progress strip on an order card.
  function pickBar(o) {
    var c = L.pickCount(S, o);
    if (!c.total) return "";
    var pct = Math.round((c.done / c.total) * 100);
    var cls = c.all ? "all" : (c.done ? "some" : "");
    return '<div class="pickbar"><div class="track"><div class="fill ' + cls +
      '" style="width:' + pct + '%"></div></div><b>' +
      (c.all ? "All picked" : c.done + " of " + c.total + " picked") + "</b></div>";
  }

  // The pick sheet. Every tick is saved to the board like a punch is, so
  // two people picking the same order see each other's ticks.
  function sheetPick(orderId) {
    sheet = {
      html: function () {
        var o = L.findOrder(S, orderId);
        if (!o) return "<h3>That order is gone.</h3>" +
          '<div class="sheetacts"><button class="mini" data-s="cancel">Close</button></div>';
        var lines = L.linesOf(o), c = L.pickCount(S, o);
        var h = "<h3>" + esc(o.so || o.customer || "Pick list") + "</h3>" +
          "<p>" + esc(o.customer || "") + " \u2014 tap a line as you put it on the cart.</p>";
        if (false) h += '<div class="ro">View only \u2014 ticks will not save from this link.</div>';
        if (!lines.length) {
          return h + '<div class="empty"><b>Nothing listed on this order.</b>inFlow has no line items on it yet.</div>' +
            '<div class="sheetacts"><button class="mini" data-s="cancel">Close</button></div>';
        }
        h += '<div class="plist">';
        lines.forEach(function (l) {
          var p = L.pickState(S, l.id);
          h += '<button class="pline' + (p ? " on" : "") + '" data-s="t:' + esc(l.id) + '"' +
            "" + '>' +
            '<span class="box">' + (p ? "\u2713" : "") + "</span>" +
            '<span class="txt"><span class="qty">' + esc(String(l.qty)) + " " + esc(l.uom || "") +
            '</span> <span class="nm">' + esc(l.name) + "</span>" +
            (p ? '<span class="by">' + esc(L.workerName(S, p.by) || "somebody") + " \u00b7 " +
                 esc(L.clockText(p.at)) + "</span>" : "") +
            "</span></button>";
        });
        h += "</div>";
        h += '<div class="hint" style="margin-top:2px">' +
          (c.all ? "Everything on this order is picked."
                 : c.done + " of " + c.total + " picked \u2014 " + c.left + " still to gather.") +
          "</div>";
        h += '<div class="sheetacts">' +
          '<button class="mini" data-s="' + (c.all ? "none" : "all") + '" style="margin-right:auto">' +
          (c.all ? "Untick everything" : "Tick everything") + "</button>" +
          '<button class="mini" data-s="print">Print it</button>' +
          '<button class="big" style="height:48px;width:auto" data-s="cancel">Done</button></div>';
        return h;
      },
      act: function (k) {
        if (k === "cancel") { closeSheet(); render(); return; }
        if (k === "print") { printPickList(orderId); return; }   // no name needed to print
        if (!me) return;
        var o = L.findOrder(S, orderId);
        if (!o) { closeSheet(); render(); return; }
        if (k.indexOf("t:") === 0) {
          var lineId = k.slice(2);
          togglePick(lineId, !L.pickState(S, lineId));
        } else if (k === "all" || k === "none") {
          var on = k === "all";
          L.linesOf(o).forEach(function (l) {
            if (!!L.pickState(S, l.id) !== on) togglePick(l.id, on);
          });
        }
        drawSheet();
        render();
      }
    };
    drawSheet();
  }

  function togglePick(lineId, on) {
    if (!me) return;
    var t = now();
    var op = { id: uid("op"), kind: "pick", lineId: lineId, workerId: me, on: !!on, at: t };
    save(L.setPick(S, lineId, me, on, t), op);
  }

  function orderLabel(o) { if (!o) return "the other order"; return o.so || o.customer || "the other order"; }

  var showDone = false;
  var query = "";
  var group = "all";

  function startOfDay(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function hoursSince(from, t) {
    var ms = 0;
    S.entries.forEach(function (e) {
      var a = Math.max(e.start, from), b = e.stop === null ? t : e.stop;
      if (b > a) ms += b - a;
    });
    return ms;
  }

  function pickWorkerView() {
    return '<div class="empty" style="padding-top:20px"><b>Who is on this device?</b>' +
      "Tap your name. This screen remembers it, so you only do this once.</div>" +
      '<div class="picklist">' +
      S.workers.map(function (w) { return '<button data-a="setme" data-id="' + w.id + '">' + esc(w.name) + "</button>"; }).join("") +
      '<button data-a="addworker" style="font-weight:600;color:var(--ink-2)">+ Add somebody else</button>' +
      "</div>";
  }

  /* ---------- Hours ---------- */
  function hoursView(t) {
    var rows = L.orderTotals(S, t).filter(function (r) { return r.entries > 0; });
    rows.sort(function (a, b) { return b.ms - a.ms; });
    var g = L.grand(S, t);
    var h = readOnlyNote() + heldNote() + skewNote(t);

    h += '<div class="strip">' +
      '<div><div class="k">Hours on the clock</div><div class="v">' + L.decHours(g.ms) + "</div></div>" +
      '<div><div class="k">Orders worked</div><div class="v">' + rows.length + "</div></div>" +
      '<div><div class="k">Running now</div><div class="v ' + (g.running ? "run" : "") + '">' +
        g.running + "</div></div>" +
      (g.flagged ? '<div><div class="k">Need a look</div><div class="v alert">' + g.flagged + "</div></div>" : "") +
      "</div>";

    h += '<div class="actbar"><button class="mini" data-a="crew">Crew list</button></div>';

    if (!rows.length) {
      return h + '<div class="empty"><b>No time on anything yet.</b>An order shows up here as soon as somebody clocks onto it.</div>';
    }

    h += '<div class="tblwrap"><table class="tight"><thead><tr><th>Order</th>' +
      '<th>Customer &amp; who worked it</th><th class="num">Hours</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      var who = Object.keys(r.workers).map(function (wid) {
        return esc(L.workerName(S, wid)) + " " + L.decHours(r.workers[wid].ms) + "h";
      }).join(", ");
      h += "<tr><td class='mono'>" + esc(r.order.so || "\u2014") +
        (r.running ? '<br><span class="tag on">Running</span>' : "") +
        (r.flagged ? '<br><span class="tag flag">Check it</span>' : "") +
        "</td><td><b>" + esc(r.order.customer || "\u2014") + "</b>" +
        (r.order.hasLabor ? ' <span class="tchip job">Job</span>' :
         r.order.hasKit ? ' <span class="tchip kit">Kit</span>' : "") +
        '<span class="subwho">' + who + "</span>" +
        '</td><td class="num">' + L.decHours(r.ms) + "</td></tr>";
    });
    h += "</tbody><tfoot><tr><td colspan='2'>All orders worked</td>" +
      '<td class="num">' + L.decHours(g.ms) + "</td></tr></tfoot></table></div>";

    var per = L.byWorker(S, t);
    if (per.length) {
      h += '<h3 style="margin:22px 0 10px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)">By person</h3>';
      h += '<div class="tblwrap"><table class="tight"><thead><tr><th>Who</th>' +
        '<th class="num">Punches</th><th class="num">Hours</th></tr></thead><tbody>';
      per.forEach(function (r) {
        h += "<tr><td><b>" + esc(r.worker.name) + '</b></td><td class="num">' + r.punches +
          '</td><td class="num">' + L.decHours(r.ms) + "</td></tr>";
      });
      h += "</tbody></table></div>";
    }

    h += '<div class="hint">These are hours only \u2014 the clock, to the second. ' +
      "Anything marked <b>Running</b> is still counting. " +
      "Derek works the money out from these hours on his side.</div>";
    return h;
  }

  /* ---------- Time log ---------- */
  function logView(t) {
    var es = S.entries.slice().sort(function (a, b) { return b.start - a.start; });
    var h = readOnlyNote() + heldNote();
    if (!es.length) return h + '<div class="empty"><b>No punches yet.</b>Every start and stop shows up here.</div>';

    h += '<div class="hint" style="margin:0 0 12px">Every punch, newest first. If somebody forgot to hit Stop, fix it here — ' +
      "corrected punches get marked so the trail stays honest.</div>";
    h += '<div class="tblwrap"><table><thead><tr><th>Order</th><th>Who</th><th>Started</th><th>Stopped</th>' +
      '<th class="num">Hours</th><th></th></tr></thead><tbody>';
    es.forEach(function (e) {
      var o = L.findOrder(S, e.orderId) || { so: "?", customer: "(deleted order)" };
      var flagged = L.isFlagged(S, e.id, t);
      h += "<tr><td class='mono'>" + esc(o.so || "—") + "<br><span style='font-family:Archivo'>" +
        esc(o.customer) + "</span></td><td>" + esc(L.workerName(S, e.workerId)) + "</td><td class='mono'>" +
        L.clockText(e.start) + "</td><td class='mono'>" +
        (e.stop === null ? '<span class="tag on">Running</span>' : L.clockText(e.stop)) +
        '</td><td class="num">' + L.decHours(L.elapsed(e, t)) + "</td><td>" +
        (flagged ? '<span class="tag flag">Check it</span> ' : "") +
        (e.edited ? '<span class="tag edit">Edited</span> ' : "") +
        '<button class="mini" data-a="edit" data-id="' + e.id + '">Fix</button></td></tr>';
    });
    h += "</tbody></table></div>";
    return h;
  }

  /* =====================================================
     LIVE TICK — repaint only the running digits, once a
     second, straight from the start time. No accumulation.
     ===================================================== */
  function tick() {
    clearInterval(ticker);
    var live = document.querySelectorAll("[data-live]");
    if (!live.length) return;
    ticker = setInterval(function () {
      var t = now(), nodes = document.querySelectorAll("[data-live]");
      if (!nodes.length) { clearInterval(ticker); return; }
      for (var i = 0; i < nodes.length; i++) {
        var e = L.findEntry(S, nodes[i].getAttribute("data-live"));
        if (e) nodes[i].textContent = L.hms(L.elapsed(e, t));
      }
    }, 1000);
  }

  /* =====================================================
     SHEETS (dialogs)
     ===================================================== */
  function drawSheet() {
    var old = document.querySelector(".sheet");
    if (old) old.remove();
    if (!sheet) return;
    var d = document.createElement("div");
    d.className = "sheet";
    d.innerHTML = '<div class="sheetbox" role="dialog" aria-modal="true">' + sheet.html() + "</div>";
    document.body.appendChild(d);
    d.addEventListener("click", function (ev) { if (ev.target === d) closeSheet(); });
    d.querySelectorAll("[data-s]").forEach(function (b) {
      b.addEventListener("click", function () { sheet.act(b.getAttribute("data-s"), d); });
    });
    var f = d.querySelector("input,select");
    if (f) f.focus();
  }
  function closeSheet() { sheet = null; var o = document.querySelector(".sheet"); if (o) o.remove(); }

  function sheetAddOrder() {
    sheet = {
      html: function () {
        return "<h3>Add an order to the board</h3><p>Put in whatever the crew will recognise on the shelf.</p>" +
          '<div class="field"><label>SO number</label><input id="f_so" placeholder="SO-001013"></div>' +
          '<div class="field"><label>Customer</label><input id="f_cust" placeholder="Larry Schmidt"></div>' +
          '<div class="field"><label>Note (optional)</label><input id="f_note" placeholder="36 panels + 2 inverters, ships Friday"></div>' +
          '<div class="sheetacts"><button class="mini" data-s="cancel">Cancel</button>' +
          '<button class="big" style="height:48px;width:auto" data-s="ok">Add it</button></div>';
      },
      act: function (a, d) {
        if (a === "cancel") return closeSheet();
        var so = d.querySelector("#f_so").value, c = d.querySelector("#f_cust").value, n = d.querySelector("#f_note").value;
        if (!so.trim() && !c.trim()) { toast("Give it an SO number or a customer name.", true); return; }
        closeSheet();
        save(L.addOrder(S, so, c, n, now()));
        render();
      }
    };
    drawSheet();
  }

  function sheetAddWorker() {
    sheet = {
      html: function () {
        return "<h3>Add somebody to the crew list</h3><p>First name is plenty.</p>" +
          '<div class="field"><label>Name</label><input id="f_w" placeholder="Myron"></div>' +
          '<div class="sheetacts"><button class="mini" data-s="cancel">Cancel</button>' +
          '<button class="big" style="height:48px;width:auto" data-s="ok">Add</button></div>';
      },
      act: function (a, d) {
        if (a === "cancel") return closeSheet();
        var n = d.querySelector("#f_w").value.trim();
        if (!n) { toast("Type a name first.", true); return; }
        var s = clone(S), id = uid("w");
        s.workers.push({ id: id, name: n });
        closeSheet();
        save(s).then(function () { setMe(id); });
        me = id; render();
      }
    };
    drawSheet();
  }

  function sheetSwitch() {
    sheet = {
      html: function () {
        return "<h3>Who is on this device?</h3><p>Whoever is punching in and out on this screen.</p>" +
          '<div class="picklist">' +
          S.workers.map(function (w) {
            return '<button data-s="pick:' + w.id + '">' + esc(w.name) + (w.id === me ? "  ✓" : "") + "</button>";
          }).join("") +
          '<button data-s="new" style="font-weight:600;color:var(--ink-2)">+ Add somebody else</button></div>' +
          '<div class="sheetacts"><button class="mini" data-s="cancel">Cancel</button></div>';
      },
      act: function (a) {
        if (a === "cancel") return closeSheet();
        if (a === "new") { closeSheet(); return sheetAddWorker(); }
        if (a.indexOf("pick:") === 0) { closeSheet(); setMe(a.slice(5)); render(); }
      }
    };
    drawSheet();
  }

  function sheetCrew() {
    sheet = {
      html: function () {
        return "<h3>Crew list</h3><p>Everybody who can punch in on this board.</p>" +
          '<div class="picklist">' +
          S.workers.map(function (w) {
            return '<div style="border:1px solid var(--line);background:var(--surface-2);' +
              'border-radius:11px;padding:14px 16px;font-size:16px;font-weight:700">' +
              esc(w.name) + (w.id === me ? '  <span class="tag">this phone</span>' : "") + "</div>";
          }).join("") + "</div>" +
          '<div class="field" style="margin-top:14px"><label>Add somebody</label>' +
          '<input id="f_new" placeholder="First name"></div>' +
          '<div class="field"><label>Flag a timer after this many hours</label>' +
          '<input id="f_long" type="number" min="1" step="1" value="' + S.settings.longRunHours + '"></div>' +
          '<div class="sheetacts"><button class="mini" data-s="cancel">Cancel</button>' +
          '<button class="big" style="height:48px;width:auto" data-s="ok">Save</button></div>';
      },
      act: function (a, d) {
        if (a === "cancel") return closeSheet();
        var next = JSON.parse(JSON.stringify(S));
        var n = d.querySelector("#f_new").value.trim();
        if (n) next.workers.push({ id: uid("w"), name: n });
        var lg = parseFloat(d.querySelector("#f_long").value);
        if (isNaN(lg) || lg < 1) { toast("Flag hours has to be at least 1.", true); return; }
        next.settings.longRunHours = lg;
        closeSheet(); save(next); render();
      }
    };
    drawSheet();
  }

  function sheetEdit(entryId) {
    var e = L.findEntry(S, entryId);
    if (!e) return;
    var o = L.findOrder(S, e.orderId) || { so: "?", customer: "?" };
    sheet = {
      html: function () {
        return "<h3>Fix this punch</h3><p>" + esc(L.workerName(S, e.workerId)) + " on " +
          esc(o.so || o.customer) + ". Change the times to what really happened.</p>" +
          '<div class="row2">' +
          '<div class="field"><label>Started</label><input id="f_a" type="datetime-local" value="' + L.forInput(e.start) + '"></div>' +
          '<div class="field"><label>Stopped</label><input id="f_b" type="datetime-local" value="' +
          (e.stop === null ? "" : L.forInput(e.stop)) + '"></div></div>' +
          '<div class="hint" style="margin-top:0">Leave Stopped empty to leave the timer running.</div>' +
          '<div class="sheetacts"><button class="mini" data-s="del" style="margin-right:auto;color:var(--alert)">Delete this punch</button>' +
          '<button class="mini" data-s="cancel">Cancel</button>' +
          '<button class="big" style="height:48px;width:auto" data-s="ok">Save the fix</button></div>';
      },
      act: function (a, d) {
        if (a === "cancel") return closeSheet();
        if (a === "del") { closeSheet(); save(L.deleteEntry(S, entryId)); render(); return; }
        var A = L.fromInput(d.querySelector("#f_a").value);
        var bv = d.querySelector("#f_b").value;
        var B = bv ? L.fromInput(bv) : null;
        if (A === null) { toast("Start time is not a real time.", true); return; }
        if (bv && B === null) { toast("Stop time is not a real time.", true); return; }
        var res = L.editEntry(S, entryId, A, B);
        if (!res.ok) { toast(res.why, true); return; }
        closeSheet(); save(res.state); render();
      }
    };
    drawSheet();
  }

  /* =====================================================
     ACTIONS
     ===================================================== */
  function setMe(id) { me = id; try { localStorage.setItem(WHO, id); } catch (x) {} }

  function doIn(orderId) {
    if (!me) return;
    var t = now();
    var prev = L.activeEntry(S, me);
    var eid = uid("e");
    var next = L.clockIn(S, me, orderId, t, eid);
    if (next === S || !L.findEntry(next, eid)) { render(); return; }
    var op = { id: uid("op"), kind: "in", entryId: eid, workerId: me, orderId: orderId, at: t };
    if (prev) op.closes = prev.id;
    save(next, op);
    render();
  }

  function doOut() {
    if (!me) return;
    var cur = L.activeEntry(S, me);
    if (!cur) { render(); return; }
    var t = now();
    var op = { id: uid("op"), kind: "out", entryId: cur.id, at: t };
    save(L.clockOut(S, me, t), op);
    render();
  }

  /* =====================================================
     WIRING
     ===================================================== */
  // Keep the cursor where the person left it when the list redraws under them.
  function focusSearch(toEnd) {
    var el = document.getElementById("q");
    if (!el) return;
    try {
      el.focus();
      if (toEnd) { var n = el.value.length; el.setSelectionRange(n, n); }
    } catch (x) {}
  }

  function wire() {
    var root = document.getElementById("root");
    var q = root.querySelector("#q");
    if (q) {
      q.addEventListener("input", function () {
        var pos = q.selectionStart;
        query = q.value;
        render();
        var el = document.getElementById("q");
        if (el) { try { el.focus(); el.setSelectionRange(pos, pos); } catch (x) {} }
      });
      q.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") { ev.preventDefault(); q.blur(); }
      });
    }
    root.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); render(); });
    });
    root.querySelectorAll("[data-a]").forEach(function (b) {
      b.addEventListener("click", function () {
        var a = b.getAttribute("data-a"), id = b.getAttribute("data-id");
        if (a === "in") doIn(id);
        else if (a === "out") doOut();
        else if (a === "setme") { setMe(id); render(); }
        else if (a === "switch") sheetSwitch();
        else if (a === "addworker") sheetAddWorker();
        else if (a === "addorder") sheetAddOrder();
        else if (a === "crew") sheetCrew();
        else if (a === "edit") sheetEdit(id);
        else if (a === "picklist") sheetPick(id);
        else if (a === "print") printPickList(id);
        else if (a === "toggledone") { showDone = !showDone; render(); }
        else if (a === "group") { group = id; render(); }
        else if (a === "clearq") { query = ""; render(); focusSearch(true); }
        else if (a === "retry") { retriesDone(); flushPending().then(function () { render(); }); }
        else if (a === "finish") { save(L.setOrderStatus(S, id, "done")); render(); }
        else if (a === "reopen") { save(L.setOrderStatus(S, id, "open"), null); render(); }
      });
    });
  }

  /* =====================================================
     START
     ===================================================== */
  function start() {
    S = loadState();
    try { me = localStorage.getItem(WHO) || null; } catch (x) { me = null; }
    if (me && !L.workerName(S, me).length) me = null;
    if (me && L.workerName(S, me) === "?") me = null;
    render();

    replayPending();

    // Repaint when the screen wakes up, so a phone that slept shows the truth,
    // and take another run at anything still waiting to be sent.
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return;
      render();
      if (pendingCount()) flushPending().then(function () { render(); });
      else pullState().then(function (changed) { if (changed) render(); });
    });
    window.addEventListener("online", function () {
      if (pendingCount()) flushPending().then(function () { render(); });
    });
    // Slow heartbeat, so a punch can never sit unsent forever.
    setInterval(function () { if (pendingCount()) flushPending().then(function () { render(); }); }, 60000);
    // And a slow pull, so one man's screen shows another man clocking on
    // without anybody reloading anything.
    setInterval(function () {
      if (pendingCount() || sheet) return;          // never yank a sheet out from under a thumb
      pullState().then(function (changed) { if (changed) render(); });
    }, 30000);
  }

  // Any punch this device made that is not in the saved data goes back on.
  function replayPending() { replayOnLoad().then(function () { render(); }); }

  return {
    start: start,
    L: L,
    _state: function () { return S; },
    _setState: function (s) { S = s; render(); },
    _setMe: function (id) { setMe(id); render(); },
    _tab: function (k) { tab = k; render(); },
    _pickSheet: function (id) { sheetPick(id); },
    _print: function (id) { printPickList(id); },
    _tick: function (lineId, on) { togglePick(lineId, on); render(); },
    _store: store,
    _pending: readPending,
    _buildDoc: buildDoc
  };
})();
App.start();
</script>
</body>
</html>
